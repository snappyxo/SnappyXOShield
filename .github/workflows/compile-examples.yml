name: Compile Examples

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UNO R3
            fqbn: arduino:avr:uno
            platform: arduino:avr
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/BasicMotorControl
              - examples/BasicMotorControlNoLibrary
          - name: UNO R4 WiFi
            fqbn: arduino:renesas_uno:unor4wifi
            platform: arduino:renesas_uno
            libraries: |
              - source-path: ./
              - source-url: https://github.com/snappyxo/microblue-arduino.git
              - name: ArduinoBLE
            sketch-paths: |
              - examples

    name: Compile for ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: ${{ matrix.platform }}
          libraries: ${{ matrix.libraries }}
          sketch-paths: ${{ matrix.sketch-paths }}
          verbose: false
